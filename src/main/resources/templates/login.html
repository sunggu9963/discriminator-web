<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/login.css}">
</head>
<body th:class="'body ' + (${formType} == 'register' ? 'show-register' : 'show-login')">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <div class="login-page">
  <div class="form">
    <form class="register-form" th:action="@{/user/signup}" th:object="${userDto}" method="post">
      <div th:replace="~{form_errors :: formErrorsFragment}"></div>
      <input type="text" th:field="*{username}" placeholder="name"/>
      <input type="password" th:field="*{password}" placeholder="password"/>
      <input type="password" th:field="*{passwordcheck}" placeholder="password_check"/>
      <input type="email" th:field="*{email}" placeholder="email address"/>
      <button>create</button>
      <p class="message">Already registered? <a href="#">Sign In</a></p>
    </form>
    <form class="login-form" th:action="@{/user/login}" method="post">
        <div th:if="${param.error}">
            <div class="alert alert-danger">
                사용자ID 또는 비밀번호를 확인해 주세요.
            </div>
        </div>
            <input type="text" name="username" id="username" placeholder="username"/>
            <input type="password" name="password" id="password" placeholder="password"/>
            <button type="submit" >login</button>
        <p class="message">Not registered? <a href="#">Create an account</a></p>
    </form>
  </div>
</div>
    
<script>
    $('.message a').click(function(){
   $('form').animate({height: "toggle", opacity: "toggle"}, "slow");
    });
</script>
</body>
</html>
