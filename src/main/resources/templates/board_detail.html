<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>detail</title>
</head>
<style>
.items-container::-webkit-scrollbar {
    width: 8px;
}

.items-container::-webkit-scrollbar-thumb {
    background-color: #888;
    border-radius: 4px;
}

.items-container::-webkit-scrollbar-thumb:hover {
    background-color: #555;
}
</style>
<body>

<div class="board-detail">
  <h2 th:text="${board.title}">제목</h2>
  <p><strong>작성자:</strong> <span th:text="${board.writer}">writer</span></p>

  <div class="items-container">
    <ul>
      <li th:each="item : ${board.items}" style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
        <p><strong>모델:</strong> <span th:text="${item.modelSpec}"></span></p>
        <p><strong>시리얼:</strong> <span th:text="${item.serialNumber}"></span></p>
      </li>
    </ul>
  </div>
</div>

</body>
</html>
